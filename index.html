<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0710" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Unbound Descent</title>
<meta name="description" content="A first-person dungeon stepper. No weapons, no armour — only your spellbook." />

<!-- Add-to-home-screen. iOS ignores the manifest's icons and only reads
     apple-touch-icon, so both have to be declared. -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<meta name="apple-mobile-web-app-title" content="Unbound Descent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root {
    --ink: #0a0710;
    --parch: #e8d9b0;
    --gold: #ffcf5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--parch);
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  /* The stage is a fixed-aspect portrait box, letterboxed on wide screens. */
  #stage {
    position: relative; overflow: hidden;
    background: var(--ink);
    box-shadow: 0 0 0 1px #000, 0 8px 60px rgba(0,0,0,.9);
  }
  /* The world renders to a low-res target and is NEAREST-upscaled inside the
     post shader, so the canvas itself is full resolution — that is what lets the
     grimoire be drawn crisply on top of chunky pixel-art walls. */
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  /* The UI layer is crisp at device resolution — pixel art world, sharp text. */
  #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #boot {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #7a6a52; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    background: var(--ink); z-index: 10; transition: opacity .5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  /* THE UPDATE SCREEN.
     Deliberately DOM and not the canvas HUD: it has to be able to stand over a
     WebView that is about to be replaced, and it must paint before the game's
     render loop exists — an update can arrive on a cold start, ahead of the
     first floor. It also has to say, in plain words, that the app is fetching
     something and that closing it now is a bad idea; a silent background
     download with no progress is what the stores object to. */
  #ota {
    position: absolute; inset: 0; z-index: 15; display: none;
    place-items: center; align-content: center; gap: 13px;
    background: var(--ink); color: #7a6a52;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    text-align: center; padding: 24px;
  }
  #ota.on { display: grid; }
  #ota .bar {
    width: min(62vw, 240px); height: 6px;
    border: 1px solid #3d3348; background: #14101c;
  }
  #ota .fill {
    height: 100%; width: 0%; background: var(--gold);
    transition: width .25s linear;
  }
  #ota .pct { color: var(--parch); letter-spacing: .3em; }
  #ota .hint { color: #55483c; font-size: 9px; }
  #err {
    position: absolute; inset: 0; z-index: 20; display: none; padding: 16px;
    background: #16060a; color: #ff9d8a; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; overflow: auto;
  }
  /* THE DEVICE'S SAFE-AREA NUMBERS, parked somewhere script can read them.
     `env()` is only legal in a stylesheet and a custom property holding one cannot be
     read back resolved, so the engine measures this box's padding once per resize.

     The stage still fills the screen — the dungeon bleeds to every edge, and only the
     CHROME steps in off it. On an iPhone the top strip belongs to the camera housing
     and every corner is cut by a ~50px radius, which is what made the cog both
     invisible and untappable in the top-right.

     `env()` is the device's own measurement where it is reported (59px of Dynamic
     Island, 34px of home indicator). The floors are for everywhere it reports
     nothing — a Capacitor WebView, a desktop browser — where a rounded display
     corner is still real. The 10px on top is the camera buffer, added to the inset
     rather than folded into its floor: the inset already clears the housing, and this
     is the difference between not clipped and not crowded. */
  #insets {
    position: fixed; top: 0; left: 0; width: 0; height: 0;
    visibility: hidden; pointer-events: none;
    padding-top: calc(max(env(safe-area-inset-top, 0px), 8px) + 10px);
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>
    <div id="boot">lighting the torches</div>
    <div id="ota" role="status" aria-live="polite">
      <div id="ota-title">updating</div>
      <div class="bar"><div class="fill" id="ota-fill"></div></div>
      <div class="pct" id="ota-pct">0%</div>
      <div class="hint">keep the app open</div>
    </div>
    <pre id="err"></pre>
  </div>
</div>
<div id="insets" aria-hidden="true"></div>
<script type="module" src="/src/main.ts"></script>
<script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += (e.error && e.error.stack ? e.error.stack : e.message) + '\n\n';
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += 'unhandled: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\n\n';
  });
</script>
</body>
</html>
