<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0710" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Unbound Descent</title>
<meta name="description" content="A first-person dungeon stepper. No weapons, no armour — only your spellbook." />

<!-- Add-to-home-screen. iOS ignores the manifest's icons and only reads
     apple-touch-icon, so both have to be declared. -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<meta name="apple-mobile-web-app-title" content="Unbound Descent" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root {
    --ink: #0a0710;
    --parch: #e8d9b0;
    --gold: #ffcf5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--parch);
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  /* The stage is inset from the physical screen edges instead of bleeding to them.
     On an iPhone the top strip belongs to the camera housing and every corner is cut
     by a ~50px radius, so the cog — drawn 6px from the stage's top-right corner —
     sat both under the status bar and outside the visible rectangle: painted, and
     untappable. The whole stage moves rather than the HUD, because the world, the
     book and the HUD are one box and one inset clears all three.

     `env()` is the device's own measurement and is exact where it is reported (59px
     of Dynamic Island, 34px of home indicator). The floors are for everywhere it
     reports nothing — a Capacitor WebView, a desktop browser — where a rounded
     display corner is still real. The camera buffer is ADDED to the top inset rather
     than folded into its floor: the inset already clears the housing, and this is the
     difference between not clipped and not crowded. */
  #app {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    --corner-buffer: 12px;
    --camera-buffer: 8px;
    padding-top: calc(max(env(safe-area-inset-top, 0px), var(--corner-buffer)) + var(--camera-buffer));
    padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--corner-buffer));
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  /* The stage is a fixed-aspect portrait box, letterboxed on wide screens. */
  #stage {
    position: relative; overflow: hidden;
    background: var(--ink);
    box-shadow: 0 0 0 1px #000, 0 8px 60px rgba(0,0,0,.9);
  }
  /* The world renders to a low-res target and is NEAREST-upscaled inside the
     post shader, so the canvas itself is full resolution — that is what lets the
     grimoire be drawn crisply on top of chunky pixel-art walls. */
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  /* The UI layer is crisp at device resolution — pixel art world, sharp text. */
  #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #boot {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #7a6a52; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    background: var(--ink); z-index: 10; transition: opacity .5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #err {
    position: absolute; inset: 0; z-index: 20; display: none; padding: 16px;
    background: #16060a; color: #ff9d8a; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; overflow: auto;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>
    <div id="boot">lighting the torches</div>
    <pre id="err"></pre>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
<script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += (e.error && e.error.stack ? e.error.stack : e.message) + '\n\n';
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += 'unhandled: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\n\n';
  });
</script>
</body>
</html>
