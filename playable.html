<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0710" />
<title>Unbound Descent</title>

<!-- The ONE external reference the readiness spec allows, and it must stay:
     ad containers inject mraid.js themselves, and it 404s harmlessly in a
     browser. Removing it is what makes a creative non-compliant on MRAID
     networks. -->
<script src="mraid.js"></script>

<style>
  :root {
    --ink: #0a0710;
    --parch: #e8d9b0;
    --gold: #ffcf5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--parch);
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  /* The stage is a fixed-aspect portrait box, letterboxed on wide screens. */
  #stage {
    position: relative; overflow: hidden;
    background: var(--ink);
    box-shadow: 0 0 0 1px #000, 0 8px 60px rgba(0,0,0,.9);
  }
  /* The world renders to a low-res target and is NEAREST-upscaled inside the
     post shader, so the canvas itself is full resolution — that is what lets the
     grimoire be drawn crisply on top of chunky pixel-art walls. */
  #view {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  /* The UI layer is crisp at device resolution — pixel art world, sharp text. */
  #ui { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #boot {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #7a6a52; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    background: var(--ink); z-index: 10; transition: opacity .5s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #err {
    position: absolute; inset: 0; z-index: 20; display: none; padding: 16px;
    background: #16060a; color: #ff9d8a; font-size: 11px; line-height: 1.5;
    white-space: pre-wrap; overflow: auto;
  }

  /* ---- ad chrome (playable only) -------------------------------------
     The offer takes the screen. It used to be an in-world panel over the
     bottom half with the game live behind it, and that read as broken: the
     wordmark landed on top of the altar's cards, and taps meant for the room
     went through to a game the player could no longer see. So while the offer
     is up the HUD canvas is hidden, the room is dimmed to a backdrop, and the
     two buttons are the only live targets on the stage. */

  /* Every generated plate is drawn at art resolution and upscaled by an exact
     integer factor, so it must never be resampled off-grid. */
  #cta, #cta-dismiss, #logo {
    background-repeat: no-repeat; background-size: 100% 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  /* One column — wordmark, store CTA, dismiss — centred a little above the
     middle, where a thumb reaches without covering the wordmark. The scrim is
     what makes the offer legible AND what makes it obvious the game is paused;
     `pointer-events: auto` on the whole inset is what stops taps reaching the
     dungeon, since the game's handlers sit on #stage above us. */
  #cta-zone {
    position: absolute; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 34px;
    padding: 24px 16px 0;
    background: radial-gradient(120% 90% at 50% 42%, rgba(22,10,32,.84), rgba(4,3,8,.95) 76%);
    opacity: 0; pointer-events: none; transition: opacity .32s ease;
  }
  #cta-zone.show { opacity: 1; pointer-events: auto; }

  /* The HUD is a canvas of its own, so the offer can take the whole screen
     without the game having to know it happened. */
  #stage.offering #ui { visibility: hidden; }

  #cta {
    border: 0; background-color: transparent; padding: 0; cursor: pointer;
    color: #2a1606; font: 700 17px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .18em; text-transform: uppercase; white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255,246,224,.55);
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.7));
    transform: translateY(10px); transition: transform .32s cubic-bezier(.2,1.4,.4,1);
  }
  #cta-zone.show #cta { transform: translateY(0); animation: ctaPulse 2.4s ease-in-out .4s infinite; }
  #cta:active { transform: translateY(3px); filter: none; }
  @keyframes ctaPulse { 0%,88%,100% { filter: drop-shadow(0 6px 14px rgba(0,0,0,.7)); } 94% { filter: drop-shadow(0 6px 14px rgba(0,0,0,.7)) brightness(1.22); } }

  #cta-dismiss {
    border: 0; background-color: transparent; padding: 0; cursor: pointer;
    color: #f0d9b5; font: 700 13px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .2em; text-transform: uppercase; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .32s ease;
  }
  #cta-dismiss.show { opacity: 1; pointer-events: auto; }
  #cta-dismiss:active { transform: translateY(2px); }

  #logo {
    opacity: 0; pointer-events: none;
    transform: translateY(-14px) scale(.94); transform-origin: 50% 50%;
    filter: drop-shadow(0 8px 18px rgba(0,0,0,.75));
    transition: opacity .38s ease, transform .38s cubic-bezier(.2,1.3,.4,1);
  }
  #logo.show { opacity: 1; transform: translateY(0) scale(1); }

  #endcard {
    position: absolute; inset: 0; z-index: 40; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px; text-align: center;
    /* Fully opaque: the game has its own death screen underneath, and letting
       two of them read through each other looked like a rendering bug. */
    background: radial-gradient(120% 90% at 50% 30%, #2a1136, #06040a 78%);
    opacity: 0; transition: opacity .4s ease;
  }
  #endcard.show { display: flex; opacity: 1; }
  #endcard h1 {
    font-size: 27px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold);
    text-shadow: 0 2px 0 #000, 0 0 24px rgba(255,207,92,.35);
  }
  #endcard p { font-size: 12px; line-height: 1.8; color: #b3a184; max-width: 22em; }
  #endcard .verdict { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #8d7c63; }
  #endcard .big {
    margin-top: 6px; padding: 15px 40px; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ffe08a, #f0a91e); color: #2a1606;
    font: 700 15px/1 ui-monospace, Menlo, monospace; letter-spacing: .16em;
    text-transform: uppercase; box-shadow: 0 5px 0 #8a5a06, 0 14px 34px rgba(0,0,0,.7);
    cursor: pointer; animation: ctaPulse 2.2s ease-in-out infinite;
  }
  #endcard .big:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a5a06; }
  #endcard .again {
    background: none; border: 0; color: #7a6a52; cursor: pointer;
    font: 400 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view"></canvas>
    <canvas id="ui"></canvas>
    <div id="boot">lighting the torches</div>
    <pre id="err"></pre>
    <div id="cta-zone">
      <div id="logo"></div>
      <button id="cta" type="button">Play Free</button>
      <button id="cta-dismiss" type="button">Keep Playing</button>
    </div>
    <div id="endcard">
      <div class="verdict" id="ec-verdict">The dungeon keeps its pages</div>
      <h1>Spelltorn Deep</h1>
      <p>No weapons. No armour. Only the book — tear its pages, fuse them, and animate the room against itself.</p>
      <button class="big" id="ec-cta" type="button">Play Free</button>
      <button class="again" id="ec-again" type="button">Keep playing</button>
    </div>
  </div>
</div>
<script type="module" src="/src/playable/main.ts"></script>
<script>
  window.addEventListener('error', (e) => {
    const el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += (e.error && e.error.stack ? e.error.stack : e.message) + '\n\n';
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += 'unhandled: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\n\n';
  });
</script>
</body>
</html>
